name: Visual & Functional Regression Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists the PR's commits on pull_request events.
  pull-requests: read

jobs:
  regression_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SARIF upload consumed account artifact storage; when the quota was hit the
          # scan itself failed. Findings still fail this step and appear in the log.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Toolchain & Dependency Audit
        run: |
          flutter --version
          dart --version
          java -version
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib/core/database/app_database.g.dart lib/l10n/gen || { echo "Committed generated sources are stale"; exit 1; }

      - name: Static Analysis & Western Digit / Localization Guard
        run: |
          flutter analyze
          python3 - << 'PY_CHECK'
          import pathlib, re, sys
          non_western = re.compile(r'[\u0660-\u0669\u06F0-\u06F9]')
          bad = []
          for p in pathlib.Path('.').rglob('*.arb'):
              txt = p.read_text(encoding='utf-8', errors='ignore')
              if non_western.search(txt):
                  bad.append(str(p))
          if bad:
              print("Non-Western digits found in ARB files:", bad)
              sys.exit(1)
          print("Western digits check passed.")
          PY_CHECK

      - name: Run Unit, Widget & Responsive Multi-Width Tests
        # Tests live in test/unit/** and test/widget/**; the old `ls test/*.dart`
        # probe found nothing there and silently skipped the whole suite.
        run: flutter test --timeout=3m
