name: Visual & Functional Regression Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Toolchain & Dependency Audit
        run: |
          flutter --version
          dart --version
          java -version
          [ -f pubspec.yaml ] && flutter pub get

      - name: Static Analysis & Western Digit / Localization Guard
        run: |
          flutter analyze || true
          python3 - << 'PY_CHECK'
          import pathlib, re, sys
          non_western = re.compile(r'[\u0660-\u0669\u06F0-\u06F9]')
          bad = []
          for p in pathlib.Path('.').rglob('*.arb'):
              txt = p.read_text(encoding='utf-8', errors='ignore')
              if non_western.search(txt):
                  bad.append(str(p))
          if bad:
              print("Non-Western digits found in ARB files:", bad)
              sys.exit(1)
          print("Western digits check passed.")
          PY_CHECK

      - name: Run Unit, Widget & Responsive Multi-Width Tests
        run: |
          if [ -d test ] && [ -n "$(ls -A test/*.dart 2>/dev/null)" ]; then
            flutter test
          else
            echo "No Dart tests yet; gate ready for Phase 1+."
          fi
