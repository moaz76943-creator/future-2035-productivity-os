name: Android emulator tests

# Runs the real app on an Android emulator (integration_test/): encrypted
# database, platform channels, notifications. Separate from the APK build so
# the test link is never held up by it.
on:
  push:
    branches:
      - main
      - claude-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Integration tests on Android 14 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Bootstrap missing Gradle wrapper
        run: bash tool/bootstrap_android_wrapper.sh

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate sources
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test --timeout 20m -d emulator-5554
