name: Android release (signed APK + AAB)

# Manual: produces store-ready artifacts only when the upload key secrets exist.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FUTURE_UPLOAD_KEYSTORE_B64   base64 of the upload keystore (.jks)
#   FUTURE_UPLOAD_STORE_PASSWORD, FUTURE_UPLOAD_KEY_ALIAS, FUTURE_UPLOAD_KEY_PASSWORD
#   FUTURE_UPLOAD_CERT_SHA256    expected SHA-256 fingerprint of the upload certificate (AA:BB:...)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Check signing secrets
        env:
          KS: ${{ secrets.FUTURE_UPLOAD_KEYSTORE_B64 }}
          SP: ${{ secrets.FUTURE_UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.FUTURE_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.FUTURE_UPLOAD_KEY_PASSWORD }}
          FP: ${{ secrets.FUTURE_UPLOAD_CERT_SHA256 }}
        run: |
          missing=""
          for v in KS SP KA KP FP; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Upload key secrets are missing:$missing. Add them before building a release."
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KS: ${{ secrets.FUTURE_UPLOAD_KEYSTORE_B64 }}
        run: |
          umask 077
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FUTURE_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Resolve and generate
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          bash tool/bootstrap_android_wrapper.sh

      - name: Test before release
        run: |
          flutter analyze
          flutter test --timeout=25m

      - name: Build signed APK and AAB
        env:
          FUTURE_UPLOAD_STORE_PASSWORD: ${{ secrets.FUTURE_UPLOAD_STORE_PASSWORD }}
          FUTURE_UPLOAD_KEY_ALIAS: ${{ secrets.FUTURE_UPLOAD_KEY_ALIAS }}
          FUTURE_UPLOAD_KEY_PASSWORD: ${{ secrets.FUTURE_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify signature, package and version
        env:
          FP: ${{ secrets.FUTURE_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" > certs.txt
          grep -qi "certificate SHA-256 digest: $(echo "$FP" | tr -d ':' | tr 'A-F' 'a-f')" certs.txt \
            || { echo "::error::APK is not signed with the expected upload key"; exit 1; }
          if grep -qi "CN=Android Debug" certs.txt; then echo "::error::debug-signed"; exit 1; fi
          "$BT/aapt2" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "name='com.deepfocus.study'" badging.txt
          jarsigner -verify "$AAB" > /dev/null
          sha256sum "$APK" "$AAB" | tee SHA256SUMS
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: future2035-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            SHA256SUMS
          retention-days: 14
          if-no-files-found: error
