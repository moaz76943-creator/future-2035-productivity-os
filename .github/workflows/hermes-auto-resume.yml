name: FUTURE 2035 Auto-Resume After Quota Reset

on:
  schedule:
    - cron: '25 0,8 * * *'

permissions:
  actions: write
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hermes/future-2035-upgrade
          fetch-depth: 1
      - name: Resume Relay on hermes/future-2035-upgrade if Phases Remain and Idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE=$(gh run list --repo "${{ github.repository }}" --workflow="hermes-relay.yml" --limit 5 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' 2>/dev/null || echo "0")
          ALL_DONE=$(python3 -c "import json; d=json.load(open('state/future2035_phases.json')); print('1' if all(p['status']=='COMPLETED' for p in d['phases']) else '0')" 2>/dev/null || echo "0")
          echo "ALL_DONE=$ALL_DONE | ACTIVE=$ACTIVE"
          if [ "$ALL_DONE" = "0" ] && [ "$ACTIVE" -eq 0 ]; then
            gh workflow run hermes-relay.yml --repo "${{ github.repository }}" -f hop="1" -f max_hops="40" --ref hermes/future-2035-upgrade
          fi
