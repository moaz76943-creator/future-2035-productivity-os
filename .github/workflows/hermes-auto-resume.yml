name: FUTURE 2035 Auto-Resume After Quota Reset

on:
  schedule:
    - cron: '25 0,8 * * *'

permissions:
  actions: write
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resume Relay on hermes/future-2035-upgrade if Phases Remain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin hermes/future-2035-upgrade 2>/dev/null && git checkout origin/hermes/future-2035-upgrade || true
          ALL_DONE=$(python3 -c "import json; d=json.load(open('state/future2035_phases.json')); print('1' if all(p['status']=='COMPLETED' for p in d['phases']) else '0')" 2>/dev/null || echo "0")
          if [ "$ALL_DONE" = "0" ]; then
            gh workflow run hermes-relay.yml -f hop="1" -f max_hops="40" --ref hermes/future-2035-upgrade
          fi
