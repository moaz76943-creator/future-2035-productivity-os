name: Android APK CI

on:
  push:
    branches:
      - main
      - claude-dev
      - 'repair/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Translations and licenses
        run: |
          python3 tool/check_l10n.py
          python3 tool/third_party_licenses.py --check
          python3 tool/check_file_size.py

      - name: Run unit tests
        run: flutter test test/unit --reporter expanded --concurrency=2 --timeout=2m

      - name: Run widget tests
        run: flutter test test/widget --reporter expanded --concurrency=2 --timeout=2m

  build-debug-apk:
    name: Build and upload Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Write access only for this job, only to publish the QA pre-release below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Bootstrap missing Gradle wrapper
        run: bash tool/bootstrap_android_wrapper.sh

      - name: Verify Gradle wrapper
        run: |
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -F 'gradle-9.5.0-all.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      # One QA signing key across CI runs, so a newer QA build installs over the
      # previous one (a fresh runner key forces uninstalling and losing data).
      # The key lives only in the Actions cache, never in the repository.
      - name: Restore QA debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: future2035-qa-debug-keystore-v1

      - name: Create QA debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E 'SHA256:' | head -1

      # Profile = AOT-compiled like the store build (smooth, fast start) but
      # debug-signed; a debug build runs the JIT and feels slow and janky.
      - name: Build QA APK (profile, AOT)
        run: flutter build apk --profile

      # Actions artifact storage can hit the account quota; a pre-release asset does
      # not count against it, so every main build stays downloadable for QA.
      - name: Publish QA pre-release (profile APK, debug-signed, not for the store)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude-dev') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-profile.apk
          test -s "$APK"
          SHORT=${GITHUB_SHA::7}
          cp "$APK" "future2035-qa-$SHORT.apk"
          sha256sum "future2035-qa-$SHORT.apk" > SHA256SUMS
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          gh release delete "qa-$SHORT" --yes --cleanup-tag 2>/dev/null || true
          gh release create "qa-$SHORT" "future2035-qa-$SHORT.apk" SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" --title "QA build $SHORT" \
            --notes "AOT (profile) QA APK built from $GITHUB_SHA (version $VERSION), signed with the CI QA key. Installs over earlier QA builds. For testing only; not for distribution."
          # Keep the five newest QA pre-releases; older ones are superseded.
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("qa-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done

      - name: Upload debug APK
        # The build itself is verified above; on main the APK is also published as a
        # pre-release asset. Only this upload may fail (account artifact quota).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: future-2035-qa-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 14
