name: Android APK CI

on:
  push:
    branches:
      - ci/safe-android-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Flutter app and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Bootstrap missing Gradle wrapper
        run: bash tool/bootstrap_android_wrapper.sh

      - name: Verify Gradle wrapper
        run: |
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -F 'gradle-9.5.0-all.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: always() && hashFiles('build/app/outputs/flutter-apk/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: future-2035-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
