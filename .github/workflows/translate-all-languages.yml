name: Translate All Languages (9 Gemini Keys - 24/7)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      langs:
        description: 'Optional comma-separated lang codes (empty = all remaining)'
        required: false
        default: ''
      max_langs:
        description: 'Max languages per run (15 recommended for safe hourly sync)'
        required: false
        default: '15'
      model:
        description: 'Optional model override (empty = auto-select strongest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: translate-all-languages
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unified multi-key translator
        timeout-minutes: 50
        env:
          DF_GEMINI_KEY_1: ${{ secrets.DF_GEMINI_KEY_1 }}
          DF_GEMINI_KEY_2: ${{ secrets.DF_GEMINI_KEY_2 }}
          DF_GEMINI_KEY_3: ${{ secrets.DF_GEMINI_KEY_3 }}
          DF_GEMINI_KEY_4: ${{ secrets.DF_GEMINI_KEY_4 }}
          DF_GEMINI_KEY_5: ${{ secrets.DF_GEMINI_KEY_5 }}
          DF_GEMINI_KEY_6: ${{ secrets.DF_GEMINI_KEY_6 }}
          DF_GEMINI_KEY_7: ${{ secrets.DF_GEMINI_KEY_7 }}
          DF_GEMINI_KEY_8: ${{ secrets.DF_GEMINI_KEY_8 }}
          DF_GEMINI_KEY_9: ${{ secrets.DF_GEMINI_KEY_9 }}
        run: |
          python3 tool/ai/packs/translate_all_langs.py \
            --repo . \
            --out /tmp/master_all.csv \
            --langs "${{ inputs.langs }}" \
            --max-langs "${{ inputs.max_langs || '15' }}" \
            --model "${{ inputs.model }}" \
            --push-packs

      - name: Sync unified master_all.csv back to repo
        if: always()
        run: |
          if [ -s /tmp/master_all.csv ]; then
            NEW_LINES=$(wc -l < /tmp/master_all.csv)
            OLD_LINES=$(wc -l < packs/seed/master_all.csv 2>/dev/null || echo 0)
            echo "Old lines: $OLD_LINES | New lines: $NEW_LINES"
            if [ "$NEW_LINES" -gt "$OLD_LINES" ]; then
              mkdir -p packs/seed packs/backup
              cp -f /tmp/master_all.csv packs/seed/master_all.csv
              cp -f /tmp/master_all.csv packs/backup/master_all.csv
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add packs/seed/master_all.csv packs/backup/master_all.csv
              if ! git diff --cached --quiet; then
                git commit -m "chore(vocab): sync cloud master_all.csv ($NEW_LINES lines)"
                git pull --rebase origin "${{ github.ref_name }}" || true
                git push
              fi
            fi
          fi

      - name: Upload unified master_all.csv artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-all-csv
          path: /tmp/master_all.csv
          if-no-files-found: ignore
