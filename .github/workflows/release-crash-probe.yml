name: Release APK crash probe

on:
  push:
    branches:
      - release/claude-dev-build
    paths:
      - '.github/workflows/release-crash-probe.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Release workflow run ID'
        required: true
        default: '45088591272'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download release APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.run_id || '45088591272' }}"
          mkdir -p /tmp/release_art
          gh run download "$RUN_ID" -R "${{ github.repository }}" -D /tmp/release_art
          APK=$(find /tmp/release_art -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK & capture crash logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell monkey -p com.deepfocus.study -c android.intent.category.LAUNCHER 1 || true
            sleep 8
            echo "========== CRASH BUFFER (-b crash) =========="
            adb logcat -d -b crash || true
            echo "========== MAIN LOGCAT =========="
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|deepfocus|future_os|flutter|MobileAds|UnsatisfiedLinkError|NoClassDefFoundError|ClassNotFoundException|IllegalStateException|VerifyError|NoSuchMethodError|SIGABRT|SIGSEGV" -A 25 | tail -n 180 || true
