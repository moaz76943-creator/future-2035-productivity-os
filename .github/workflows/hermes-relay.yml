name: FUTURE 2035 Zero-Loss 9-Key Cloud Relay

on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      hop:
        description: "Current relay hop"
        default: "1"
      max_hops:
        description: "Maximum relay hops"
        default: "40"

permissions:
  issues: write
  contents: write
  actions: write

concurrency:
  group: future2035-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous_engineer:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Notify Live Monitor #11
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 11 --repo "${{ github.repository }}" --body "🚀 Run ${{ github.run_id }} on ${{ github.ref_name }} ($(date -u +%H:%M:%SZ))" || true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Runner Disk Space for Android NDK/CMake
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Set up Java 17 & Flutter
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Zero-Loss Ranked Cycle (Auto-Push Every Step, Safe 3.5h Cutoff)
        if: always()
        env:
          GOOGLE_KEYS_LIST: ${{ secrets.GOOGLE_KEYS_LIST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "future2035-relay-bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin hermes/future-2035-upgrade >/dev/null 2>&1; then
            git fetch origin hermes/future-2035-upgrade
            git checkout -B hermes/future-2035-upgrade origin/hermes/future-2035-upgrade
          else
            git checkout -B hermes/future-2035-upgrade
          fi
          printf '%s\n' "$GOOGLE_KEYS_LIST" > /tmp/keys.list
          JOB_START=$(date +%s)
          MAX_WALL=3600

          save_progress() {
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(relay-hop-${{ inputs.hop || '1' }}): checkpoint verified FUTURE 2035 progress" || true
              git pull origin hermes/future-2035-upgrade --rebase || echo "WARN: rebase failed"
              git push -u origin hermes/future-2035-upgrade || echo "WARN: push failed"
              gh issue comment 11 --repo "${{ github.repository }}" --body "✅ Checkpoint pushed on hop ${{ inputs.hop || '1' }} ($(date -u +%H:%M:%SZ))" || true
            fi
          }

          PROMPT="Read AGENTS.md, docs/FLASHCARDS_MASTER_DIRECTIVE.md, docs/MASTER_DIRECTIVE_V1.md, and state/future2035_phases.json. Work ONLY on branch hermes/future-2035-upgrade. CRITICAL: (1) Complete ONLY the single current IN_PROGRESS phase in state/future2035_phases.json without rewriting existing working code. (2) Enforce Western digits (0-9), zero Hebrew (he/iw), smart progressive-disclosure buttons, and update docs/qa/CONTROL_INVENTORY.md + test/widget/control_inventory_test.dart for any new controls. (3) Before finishing, run with bounded timeouts so nothing hangs: flutter analyze --no-fatal-infos && timeout 180 flutter test && python3 tool/check_l10n.py. (4) Mark the finished phase COMPLETED in state/future2035_phases.json, set the next phase IN_PROGRESS, and commit. (5) Smartly inspect origin/claude-dev (read-only) and port only high-value features/fixes/UX improvements not already better in hermes/future-2035-upgrade; keep whichever implementation is better, preserve clean screen simplicity with smart button placement and progressive disclosure (no cluttered UI or dead controls), respect lib/core/design_system, and keep manual code files <= 400 lines. (5) Follow the Periodic Claude Branch Learning rule in AGENTS.md (audit origin/claude-dev read-only every 3 completed phases via state/claude_sync_state.json, port only superior/missing features while keeping UI simple, smart button placement, lib/core/design_system, and <=400 lines/file). (6) If all phases in state/future2035_phases.json are COMPLETED, follow the Continuous Deep-Audit & Self-Evolution Loop in AGENTS.md: deeply audit the app, append 2-3 new PHASE_EVO_* tasks, and execute the first one safely."
          DONE=0

          for MODEL in "gemini-4-hydrogen" "gemini-3.8-flash" "gemini-3.6-flash" "gemini-3-flash-preview"; do
            IDX=0
            gh issue comment 11 --repo "${{ github.repository }}" --body "🔄 Trying model: $MODEL ($(date -u +%H:%M:%SZ))" || true
            while IFS= read -r K; do
              [ -n "$K" ] || continue
              NOW=$(date +%s)
              [ $((NOW - JOB_START)) -ge $MAX_WALL ] && break 2
              IDX=$((IDX + 1))
              [ $IDX -gt 9 ] && break
              echo "Trying Gemini key #$IDX with $MODEL (timeout 5m)..."
              if GEMINI_API_KEY="$K" GOOGLE_API_KEY="$K" timeout -k 15s 5m hermes chat --cli --yolo --oneshot --provider gemini -m "$MODEL" -q "$PROMPT"; then
                DONE=1
                save_progress
                break 2
              else
                RC=$?
                echo "Attempt failed or timed out (rc=$RC) for key #$IDX with $MODEL"
              fi
              save_progress
              sleep 2
            done < /tmp/keys.list
          done

          run_fallback() {
            local label="$1"
            local key_val="$2"
            shift 2
            local now_ts
            now_ts=$(date +%s)
            if [ "$DONE" -eq 0 ] && [ $((now_ts - JOB_START)) -lt $MAX_WALL ] && [ -n "$key_val" ]; then
              echo "[Fallback] Trying $label (timeout 5m)..."
              if timeout -k 15s 5m "$@"; then
                DONE=1
              else
                echo "[Fallback] $label failed or timed out (rc=$?)"
              fi
              save_progress
            fi
          }

          run_fallback "OpenRouter (gemini-3-flash-preview)" "${OPENROUTER_API_KEY:-}" hermes chat --cli --yolo --oneshot --provider openrouter -m "google/gemini-3-flash-preview" -q "$PROMPT"
          run_fallback "OpenRouter (openrouter/free)" "${OPENROUTER_API_KEY:-}"             hermes chat --cli --yolo --oneshot -m "openrouter/free" -q "$PROMPT"

          run_fallback "Groq (llama-3.3-70b-versatile)" "${GROQ_API_KEY:-}" \
            hermes chat --cli --yolo --oneshot --provider groq -m "llama-3.3-70b-versatile" -q "$PROMPT"

          run_fallback "NVIDIA (nemotron-3-ultra-550b-a55b)" "${NVIDIA_API_KEY:-}"             hermes chat --cli --yolo --oneshot --provider nvidia -m "nvidia/nemotron-3-ultra-550b-a55b" -q "$PROMPT"
          FIRST_GKEY="${GOOGLE_KEYS_LIST%%[,[:space:]]*}"
          run_fallback "Last-Resort Gemini (3.5-flash-lite)" "${FIRST_GKEY:-}" env GEMINI_API_KEY="$FIRST_GKEY" GOOGLE_API_KEY="$FIRST_GKEY" hermes chat --cli --yolo --oneshot --provider gemini -m "gemini-3.5-flash-lite" -q "$PROMPT"
          echo "RELAY_DONE=$DONE" >> "$GITHUB_ENV"
          rm -f /tmp/keys.list

      - name: Enforce Single Branch & Migrate Stray Work
        run: |
          chmod +x scripts/enforce_hermes_branch.sh
          ./scripts/enforce_hermes_branch.sh

      - name: Anti-Loop Circuit Breaker
        run: |
          chmod +x scripts/anti_loop_guard.sh
          ./scripts/anti_loop_guard.sh

      - name: Read-Only Claude Branch Scout
        run: |
          chmod +x scripts/claude_readonly_scout.sh
          ./scripts/claude_readonly_scout.sh

      - name: Final Push & Trigger Next Relay Hop
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "future2035-relay-bot"
          git config user.email "actions@github.com"
          git checkout -B hermes/future-2035-upgrade
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(relay-hop-${{ inputs.hop || '1' }}): final hop checkpoint" || true
            git pull origin hermes/future-2035-upgrade --rebase || echo "WARN: final rebase failed"
            git push -u origin hermes/future-2035-upgrade || echo "WARN: final push failed"
          fi
          CURRENT_HOP="${{ inputs.hop || '1' }}"
          MAX_HOPS="${{ inputs.max_hops || '40' }}"
          ALL_DONE=$(python3 -c "import json; d=json.load(open('state/future2035_phases.json')); print('1' if all(p['status']=='COMPLETED' for p in d['phases']) else '0')" 2>/dev/null || echo "0")
          if [ "$ALL_DONE" = "0" ] && [ "${RELAY_DONE:-0}" = "1" ] && [ "$CURRENT_HOP" -lt "$MAX_HOPS" ]; then
            NEXT_HOP=$((CURRENT_HOP + 1))
            gh workflow run hermes-relay.yml -f hop="$NEXT_HOP" -f max_hops="$MAX_HOPS" --ref hermes/future-2035-upgrade || true
          fi
