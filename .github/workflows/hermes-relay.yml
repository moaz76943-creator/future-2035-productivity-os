name: FUTURE 2035 Zero-Loss 9-Key Cloud Relay

on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      hop:
        description: "Current relay hop"
        default: "1"
      max_hops:
        description: "Maximum relay hops"
        default: "40"

permissions:
  contents: write
  actions: write

concurrency:
  group: future2035-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous_engineer:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No git credentials while the external agent runs (it uses --yolo):
          # only the final step below pushes, with an explicit token, and only
          # to hermes/future-2035-upgrade. It can never write to main.
          persist-credentials: false

      - name: Free Runner Disk Space for Android NDK/CMake
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Set up Java 17 & Flutter
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Zero-Loss Ranked Cycle (Auto-Push Every Step, Safe 3.5h Cutoff)
        if: always()
        env:
          GOOGLE_KEYS_LIST: ${{ secrets.GOOGLE_KEYS_LIST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          git config user.name "future2035-relay-bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin hermes/future-2035-upgrade >/dev/null 2>&1; then
            git fetch origin hermes/future-2035-upgrade
            git checkout -B hermes/future-2035-upgrade origin/hermes/future-2035-upgrade
          else
            git checkout -B hermes/future-2035-upgrade
          fi
          printf '%s\n' "$GOOGLE_KEYS_LIST" > /tmp/keys.list
          JOB_START=$(date +%s)
          MAX_WALL=12600

          save_progress() {
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(relay-hop-${{ inputs.hop || '1' }}): checkpoint verified FUTURE 2035 progress" || true
              git pull origin hermes/future-2035-upgrade --rebase || true
              git push -u origin hermes/future-2035-upgrade || true
            fi
          }

          PROMPT="Read docs/FLASHCARDS_MASTER_DIRECTIVE.md, docs/MASTER_DIRECTIVE_V1.md, and state/future2035_phases.json. Work ONLY on branch hermes/future-2035-upgrade. CRITICAL: (1) Complete ONLY the single current IN_PROGRESS phase in state/future2035_phases.json without rewriting existing working code. (2) Enforce Western digits (0-9), zero Hebrew (he/iw), smart progressive-disclosure buttons, and update docs/qa/CONTROL_INVENTORY.md + test/widget/control_inventory_test.dart for any new controls. (3) Before finishing, you MUST pass: flutter analyze --no-fatal-infos, flutter test, and python3 tool/check_l10n.py. (4) Mark the finished phase COMPLETED in state/future2035_phases.json, set the next phase IN_PROGRESS, and commit."
          DONE=0

          for MODEL in "gemini-4-hydrogen" "gemini-3.1-pro-preview" "gemini-3.8-flash" "gemini-3.6-flash"; do
            IDX=0
            while IFS= read -r K; do
              [ -n "$K" ] || continue
              NOW=$(date +%s)
              [ $((NOW - JOB_START)) -ge $MAX_WALL ] && break 2
              IDX=$((IDX + 1))
              echo "Trying Gemini key #$IDX with $MODEL..."
              if GEMINI_API_KEY="$K" GOOGLE_API_KEY="$K" timeout 25m hermes chat --cli --yolo --oneshot --provider gemini -m "$MODEL" -q "$PROMPT"; then
                DONE=1
                save_progress
                break 2
              fi
              save_progress
              sleep 2
            done < /tmp/keys.list
          done

          NOW=$(date +%s)
          if [ "$DONE" -eq 0 ] && [ $((NOW - JOB_START)) -lt $MAX_WALL ] && [ -n "${OPENROUTER_API_KEY:-}" ]; then
            timeout 25m hermes chat --cli --yolo --oneshot -m "openrouter/free" -q "$PROMPT" && DONE=1 || true
            save_progress
          fi

          NOW=$(date +%s)
          if [ "$DONE" -eq 0 ] && [ $((NOW - JOB_START)) -lt $MAX_WALL ] && [ -n "${NVIDIA_API_KEY:-}" ]; then
            timeout 25m hermes chat --cli --yolo --oneshot --provider nvidia -m "nvidia/nemotron-3-ultra-550b-a55b" -q "$PROMPT" || true
            save_progress
          fi
          echo "RELAY_DONE=$DONE" >> "$GITHUB_ENV"
          rm -f /tmp/keys.list

      - name: Final Push & Trigger Next Relay Hop
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "future2035-relay-bot"
          git config user.email "actions@github.com"
          git checkout -B hermes/future-2035-upgrade
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(relay-hop-${{ inputs.hop || '1' }}): final hop checkpoint" || true
          fi
          # Push all hop commits, to the relay branch only.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull "$REMOTE" hermes/future-2035-upgrade --rebase || true
          git push "$REMOTE" HEAD:refs/heads/hermes/future-2035-upgrade || true
          CURRENT_HOP="${{ inputs.hop || '1' }}"
          MAX_HOPS="${{ inputs.max_hops || '40' }}"
          ALL_DONE=$(python3 -c "import json; d=json.load(open('state/future2035_phases.json')); print('1' if all(p['status']=='COMPLETED' for p in d['phases']) else '0')" 2>/dev/null || echo "0")
          if [ "$ALL_DONE" = "0" ] && [ "${RELAY_DONE:-0}" = "1" ] && [ "$CURRENT_HOP" -lt "$MAX_HOPS" ]; then
            NEXT_HOP=$((CURRENT_HOP + 1))
            gh workflow run hermes-relay.yml -f hop="$NEXT_HOP" -f max_hops="$MAX_HOPS" --ref hermes/future-2035-upgrade || true
          fi
