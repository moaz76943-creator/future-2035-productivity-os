name: FUTURE 2035 Zero-Loss 9-Key Cloud Relay
true:
  schedule:
  - cron: 15 8 * * *
  workflow_dispatch:
    inputs:
      hop:
        description: Current relay hop
        default: '1'
      max_hops:
        description: Maximum relay hops
        default: '40'
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: future2035-relay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  autonomous_engineer:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
    - name: 'Notify Live Monitor #11'
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh issue comment 11 --body "🚀 Run ${{ github.run_id }} on ${{ github.ref_name
        }} ($(date -u +%H:%M:%SZ))" || true
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Free Runner Disk Space for Android NDK/CMake
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
    - name: Set up Java 17 & Flutter
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Install Hermes Agent
      run: 'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s
        -- --non-interactive --skip-browser --skip-computer-use

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        '
    - name: Run Zero-Loss Ranked Cycle (Auto-Push Every Step, Safe 3.5h Cutoff)
      if: always()
      env:
        GOOGLE_KEYS_LIST: ${{ secrets.GOOGLE_KEYS_LIST }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "git config user.name \"future2035-relay-bot\"\ngit config user.email \"\
        actions@github.com\"\nif git ls-remote --exit-code --heads origin hermes/future-2035-upgrade\
        \ >/dev/null 2>&1; then\n  git fetch origin hermes/future-2035-upgrade\n \
        \ git checkout -B hermes/future-2035-upgrade origin/hermes/future-2035-upgrade\n\
        else\n  git checkout -B hermes/future-2035-upgrade\nfi\nprintf '%s\\n' \"\
        $GOOGLE_KEYS_LIST\" > /tmp/keys.list\nJOB_START=$(date +%s)\nMAX_WALL=12600\n\
        \nsave_progress() {\n  git add -A\n  if ! git diff --cached --quiet; then\n\
        \    git commit -m \"chore(relay-hop-${{ inputs.hop || '1' }}): checkpoint\
        \ verified FUTURE 2035 progress\" || true\n    git pull origin hermes/future-2035-upgrade\
        \ --rebase || echo \"WARN: rebase failed\"\n    git push -u origin hermes/future-2035-upgrade\
        \ || echo \"WARN: push failed\"\n  fi\n}\n\nPROMPT=\"Read docs/FLASHCARDS_MASTER_DIRECTIVE.md,\
        \ docs/MASTER_DIRECTIVE_V1.md, and state/future2035_phases.json. Work ONLY\
        \ on branch hermes/future-2035-upgrade. CRITICAL: (1) Complete ONLY the single\
        \ current IN_PROGRESS phase in state/future2035_phases.json without rewriting\
        \ existing working code. (2) Enforce Western digits (0-9), zero Hebrew (he/iw),\
        \ smart progressive-disclosure buttons, and update docs/qa/CONTROL_INVENTORY.md\
        \ + test/widget/control_inventory_test.dart for any new controls. (3) Before\
        \ finishing, run with bounded timeouts so nothing hangs: flutter analyze --no-fatal-infos\
        \ && timeout 180 flutter test && python3 tool/check_l10n.py. (4) Mark the\
        \ finished phase COMPLETED in state/future2035_phases.json, set the next phase\
        \ IN_PROGRESS, and commit.\"\nDONE=0\n\nfor MODEL in \"gemini-4-hydrogen\"\
        \ \"gemini-3.1-pro-preview\" \"gemini-3.8-flash\" \"gemini-3.6-flash\"; do\n\
        \  IDX=0\n  while IFS= read -r K; do\n    [ -n \"$K\" ] || continue\n    NOW=$(date\
        \ +%s)\n    [ $((NOW - JOB_START)) -ge $MAX_WALL ] && break 2\n    IDX=$((IDX\
        \ + 1))\n    echo \"Trying Gemini key #$IDX with $MODEL (timeout 8m)...\"\n\
        \    if GEMINI_API_KEY=\"$K\" GOOGLE_API_KEY=\"$K\" timeout -k 15s 8m hermes\
        \ chat --cli --yolo --oneshot --provider gemini -m \"$MODEL\" -q \"$PROMPT\"\
        ; then\n      DONE=1\n      save_progress\n      break 2\n    else\n     \
        \ RC=$?\n      echo \"Attempt failed or timed out (rc=$RC) for key #$IDX with\
        \ $MODEL\"\n    fi\n    save_progress\n    sleep 2\n  done < /tmp/keys.list\n\
        done\n\nrun_fallback() {\n  local label=\"$1\"\n  local key_val=\"$2\"\n \
        \ shift 2\n  local now_ts\n  now_ts=$(date +%s)\n  if [ \"$DONE\" -eq 0 ]\
        \ && [ $((now_ts - JOB_START)) -lt $MAX_WALL ] && [ -n \"$key_val\" ]; then\n\
        \    echo \"[Fallback] Trying $label (timeout 8m)...\"\n    if timeout -k\
        \ 15s 8m \"$@\"; then\n      DONE=1\n    else\n      echo \"[Fallback] $label\
        \ failed or timed out (rc=$?)\"\n    fi\n    save_progress\n  fi\n}\n\nrun_fallback\
        \ \"OpenRouter (openrouter/free)\" \"${OPENROUTER_API_KEY:-}\"           \
        \  hermes chat --cli --yolo --oneshot -m \"openrouter/free\" -q \"$PROMPT\"\
        \n\nrun_fallback \"Groq (llama-3.3-70b-versatile)\" \"${GROQ_API_KEY:-}\"\
        \ \\\n  hermes chat --cli --yolo --oneshot --provider groq -m \"llama-3.3-70b-versatile\"\
        \ -q \"$PROMPT\"\n\nrun_fallback \"NVIDIA (nemotron-3-ultra-550b-a55b)\" \"\
        ${NVIDIA_API_KEY:-}\"             hermes chat --cli --yolo --oneshot --provider\
        \ nvidia -m \"nvidia/nemotron-3-ultra-550b-a55b\" -q \"$PROMPT\"\necho \"\
        RELAY_DONE=$DONE\" >> \"$GITHUB_ENV\"\nrm -f /tmp/keys.list\n"
    - name: Enforce Single Branch & Migrate Stray Work
      run: 'chmod +x scripts/enforce_hermes_branch.sh

        ./scripts/enforce_hermes_branch.sh

        '
    - name: Anti-Loop Circuit Breaker
      run: 'chmod +x scripts/anti_loop_guard.sh

        ./scripts/anti_loop_guard.sh

        '
    - name: Read-Only Claude Branch Scout
      run: 'chmod +x scripts/claude_readonly_scout.sh

        ./scripts/claude_readonly_scout.sh

        '
    - name: Final Push & Trigger Next Relay Hop
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "git config user.name \"future2035-relay-bot\"\ngit config user.email \"\
        actions@github.com\"\ngit checkout -B hermes/future-2035-upgrade\ngit add\
        \ -A\nif ! git diff --cached --quiet; then\n  git commit -m \"chore(relay-hop-${{\
        \ inputs.hop || '1' }}): final hop checkpoint\" || true\n  git pull origin\
        \ hermes/future-2035-upgrade --rebase || echo \"WARN: final rebase failed\"\
        \n  git push -u origin hermes/future-2035-upgrade || echo \"WARN: final push\
        \ failed\"\nfi\nCURRENT_HOP=\"${{ inputs.hop || '1' }}\"\nMAX_HOPS=\"${{ inputs.max_hops\
        \ || '40' }}\"\nALL_DONE=$(python3 -c \"import json; d=json.load(open('state/future2035_phases.json'));\
        \ print('1' if all(p['status']=='COMPLETED' for p in d['phases']) else '0')\"\
        \ 2>/dev/null || echo \"0\")\nif [ \"$ALL_DONE\" = \"0\" ] && [ \"${RELAY_DONE:-0}\"\
        \ = \"1\" ] && [ \"$CURRENT_HOP\" -lt \"$MAX_HOPS\" ]; then\n  NEXT_HOP=$((CURRENT_HOP\
        \ + 1))\n  gh workflow run hermes-relay.yml -f hop=\"$NEXT_HOP\" -f max_hops=\"\
        $MAX_HOPS\" --ref hermes/future-2035-upgrade || true\nfi\n"
