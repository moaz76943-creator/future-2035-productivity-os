name: FUTURE 2035 Hydrogen & 3.8-Flash 9-Key Cloud Relay

on:
  workflow_dispatch:
    inputs:
      hop:
        description: "Current relay hop"
        default: "1"
      max_hops:
        description: "Maximum relay hops"
        default: "30"

permissions:
  contents: write
  actions: write

concurrency:
  group: future2035-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous_engineer:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 & Flutter
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Free Runner Disk Space for Android NDK/CMake
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Ranked Hydrogen & 3.8-Flash 9-Key Cycle
        if: always()
        env:
          GOOGLE_KEYS_LIST: ${{ secrets.GOOGLE_KEYS_LIST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          printf '%s\n' "$GOOGLE_KEYS_LIST" > /tmp/keys.list
          PROMPT="Read docs/MASTER_DIRECTIVE_V1.md and state/future2035_phases.json. STRICT RULES: (1) If current_phase is PHASE_0_DISCOVERY, perform a full read-only audit of the existing repository (branches, Flutter/Dart/AGP/Gradle/Kotlin versions, Drift/Riverpod/GoRouter, UI, tests, and CI) and write state/PHASE_0_AUDIT.md WITHOUT rewriting existing working code. (2) Advance only ONE phase per hop. Never skip or fake features. Every visible button must have a real handler and widget test. (3) Enforce White Luxury UI, responsive multi-width tests (320, 360, 412, 600, 840, 1024), Arabic RTL + Western digits (0-9). (4) Before marking any phase COMPLETED, flutter analyze, flutter test, and flutter build apk --debug MUST actually pass. Update state/future2035_phases.json and REPORT.md with real evidence."
          DONE=0

          for MODEL in "gemini-4-hydrogen" "gemini-3.8-flash" "gemini-3.6-flash"; do
            IDX=0
            while IFS= read -r K; do
              [ -n "$K" ] || continue
              IDX=$((IDX + 1))
              echo "Trying Gemini key #$IDX with model $MODEL..."
              if GEMINI_API_KEY="$K" GOOGLE_API_KEY="$K" timeout 240m hermes chat --cli --yolo --oneshot --provider gemini -m "$MODEL" -q "$PROMPT"; then
                DONE=1
                break 2
              fi
              sleep 2
            done < /tmp/keys.list
          done

          if [ "$DONE" -eq 0 ] && [ -n "${OPENROUTER_API_KEY:-}" ]; then
            timeout 240m hermes chat --cli --yolo --oneshot -m "openrouter/free" -q "$PROMPT" && DONE=1 || true
          fi

          if [ "$DONE" -eq 0 ] && [ -n "${NVIDIA_API_KEY:-}" ]; then
            timeout 240m hermes chat --cli --yolo --oneshot --provider nvidia -m "nvidia/nemotron-3-ultra-550b-a55b" -q "$PROMPT" || true
          fi
          rm -f /tmp/keys.list

      - name: Commit & Push + Trigger Next Hop
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "future2035-relay-bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(relay-hop-${{ inputs.hop || '1' }}): advance FUTURE 2035 engineering phase"
            git push origin main
          fi
          CURRENT_HOP="${{ inputs.hop || '1' }}"
          MAX_HOPS="${{ inputs.max_hops || '30' }}"
          ALL_DONE=$(python3 -c "import json; d=json.load(open('state/future2035_phases.json')); print('1' if all(p['status']=='COMPLETED' for p in d['phases']) else '0')" 2>/dev/null || echo "0")
          if [ "$ALL_DONE" = "0" ] && [ "$CURRENT_HOP" -lt "$MAX_HOPS" ]; then
            NEXT_HOP=$((CURRENT_HOP + 1))
            gh workflow run hermes-relay.yml -f hop="$NEXT_HOP" -f max_hops="$MAX_HOPS" --ref main || true
          fi
