name: Periodic Claude Learning Reminder (Every 3 Days)

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-claude-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hermes/future-2035-upgrade
          fetch-depth: 20

      - name: Check if origin/claude-dev has new commits and Hermes is idle
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin claude-dev
          LATEST_CLAUDE=$(git rev-parse origin/claude-dev)
          LAST_AUDITED=""
          if [ -f state/claude_sync_state.json ]; then
            LAST_AUDITED=$(python3 -c "import json; print(json.load(open('state/claude_sync_state.json')).get('last_audited_commit',''))" 2>/dev/null || true)
          fi
          ACTIVE=$(gh run list --repo "${{ github.repository }}" --workflow="hermes-relay.yml" --limit 5 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' 2>/dev/null || echo "0")
          echo "Latest Claude: $LATEST_CLAUDE | Last Audited: ${LAST_AUDITED:-none} | Active Relay: $ACTIVE"
          if [ "$LATEST_CLAUDE" != "$LAST_AUDITED" ] && [ "$ACTIVE" -eq 0 ]; then
            echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Hermes relay only when new Claude updates exist and idle
        if: steps.check.outputs.should_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run hermes-relay.yml --repo "${{ github.repository }}" --ref hermes/future-2035-upgrade
