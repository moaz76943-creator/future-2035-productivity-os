name: DF heartbeat (keeps every agent running, even when cron does not fire)

# GitHub's scheduler did not start the hourly cron workflows here, so this job is the clock:
# it runs ~5h40m, starts the agents (rotating job + task job) every hour when idle and the
# watch every 2 hours, then starts its own next run. Free on a public repository.
# A push of this file (or tool/ai changes) or a manual run starts it again.
on:
  push:
    branches: [claude-dev]
    paths: ['.github/workflows/df-heartbeat.yml', 'tool/ai/**']
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: df-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the agents every hour
        run: |
          set -u
          idle() { [ "$(gh run list --workflow "$1" --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting")] | length' 2>/dev/null || echo 1)" = 0 ]; }
          end=$(( $(date +%s) + 335 * 60 )); n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            # Free-model quotas reset at 08:00 UTC: busy hours (08-19 UTC) run three different jobs
            # side by side (task queue, file review, new tests); quiet hours run one small job.
            h=$((10#$(date -u +%H)))
            if [ "$h" -ge 8 ] && [ "$h" -lt 20 ]; then
              for j in task improve tests; do gh workflow run df-ai-agents.yml --ref claude-dev -f job=$j && echo "$j started"; done
            else
              [ $((n % 2)) -eq 0 ] && idle df-ai-agents.yml && gh workflow run df-ai-agents.yml --ref claude-dev && echo "agent started"
            fi
            # Word packs are paused (the owner provides the word lists); start df-packs by hand.
            [ $((n % 2)) -eq 0 ] && idle df-ai-watch.yml && gh workflow run df-ai-watch.yml --ref claude-dev
            n=$((n + 1)); sleep 3600
          done
      - name: Start the next heartbeat
        if: always()
        run: gh workflow run df-heartbeat.yml --ref claude-dev || true
