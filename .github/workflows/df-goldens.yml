name: DF golden screens
# Pixel check of the main tabs (ar + en). A red run = a screen changed.
#  - intended change: gh workflow run df-goldens.yml -f update=true  (rewrites the reference images)
#  - first run: same command (creates them).
on:
  push:
    branches: [claude-dev]
    paths: ['lib/**', 'test/golden/**', 'ai/run/goldens-update.txt']
  workflow_dispatch:
    inputs:
      update:
        description: 'Rewrite reference images (true/false)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: df-goldens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [ar, en]
    steps:
      - uses: actions/checkout@v7
        with: {ref: claude-dev, fetch-depth: 2}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.50.0', channel: stable, cache: true}
      - name: Prepare
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n && python3 tool/gen_l10n_custom.py
      - name: Decide mode
        run: |
          UP="${{ inputs.update }}"
          git fetch -q --depth=2 origin claude-dev || true
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^ai/run/goldens-update.txt$'; then UP=true; fi
          echo "UPDATE=$UP" >> "$GITHUB_ENV"
      - name: Compare
        if: ${{ env.UPDATE != 'true' }}
        run: |
          if [ ! -d test/golden/goldens/${{ matrix.tag }} ]; then echo "No reference images yet: push a change to ai/run/goldens-update.txt" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          flutter test --reporter compact --dart-define=GOLDEN=true --dart-define=TAG=${{ matrix.tag }} test/golden
      - name: Update
        if: ${{ env.UPDATE == 'true' }}
        run: flutter test --reporter compact --dart-define=GOLDEN=true --dart-define=TAG=${{ matrix.tag }} --update-goldens test/golden
      - name: Save images
        if: ${{ env.UPDATE == 'true' }}
        run: |
          git config user.name "df-bot"; git config user.email "df-bot@users.noreply.github.com"
          git add test/golden/goldens
          git diff --cached --quiet || { git commit -qm "golden screens (${{ matrix.tag }})"; ok=0; for i in 1 2 3 4; do git pull -q --rebase --autostash origin claude-dev && git push -q origin HEAD:claude-dev && ok=1 && break; sleep 5; done; [ $ok = 1 ] || { echo '::error::push failed'; exit 1; }; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff-${{ matrix.tag }}
          path: test/golden/failures
          if-no-files-found: ignore
          retention-days: 7
