name: DF golden screens
# Pixel check of the main tabs (ar + en). A red run = a screen changed.
#  - intended change: gh workflow run df-goldens.yml -f update=true  (rewrites the reference images)
#  - first run: same command (creates them).
on:
  push:
    branches: [claude-dev]
    paths: ['lib/**', 'test/golden/**']
  workflow_dispatch:
    inputs:
      update:
        description: 'Rewrite reference images (true/false)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: df-goldens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [ar, en]
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude-dev}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.50.0', channel: stable, cache: true}
      - name: Prepare
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n && python3 tool/gen_l10n_custom.py
      - name: Compare
        if: ${{ inputs.update != 'true' }}
        run: |
          if [ ! -d test/golden/goldens/${{ matrix.tag }} ]; then echo "No reference images yet: run with -f update=true" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          flutter test --reporter compact --dart-define=GOLDEN=true --dart-define=TAG=${{ matrix.tag }} test/golden
      - name: Update
        if: ${{ inputs.update == 'true' }}
        run: flutter test --reporter compact --dart-define=GOLDEN=true --dart-define=TAG=${{ matrix.tag }} --update-goldens test/golden
      - name: Save images
        if: ${{ inputs.update == 'true' }}
        run: |
          git config user.name "df-bot"; git config user.email "df-bot@users.noreply.github.com"
          git add test/golden/goldens
          git diff --cached --quiet || { git commit -qm "golden screens (${{ matrix.tag }})"; for i in 1 2 3; do git pull -q --rebase origin claude-dev && git push -q origin HEAD:claude-dev && break; sleep 5; done; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff-${{ matrix.tag }}
          path: test/golden/failures
          if-no-files-found: ignore
          retention-days: 7
