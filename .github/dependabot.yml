# Weekly update suggestions as PRs into claude-dev (never auto-merged; Claude reviews).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: claude-dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: pub
    directory: /
    target-branch: claude-dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
